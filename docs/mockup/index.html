#app{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
#hdr{height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#hdr .logo{width:46px;height:42px}
#hdr h1{margin:0;font-size:23px;font-weight:700;letter-spacing:1px;color:var(--title)}
#hdr small{display:block;font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-top:-3px}
.sp{flex:1}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--selbd)}.btn.on{background:var(--selbg);border-color:var(--selbd);color:var(--seltx)}
.btn.sm{padding:1px 6px;font-size:11px}
select.sel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:2px 4px;font:inherit;font-size:12px;max-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg b{font-weight:600;padding:2px 7px;font-size:11px;cursor:pointer;background:var(--panel2);color:var(--dim);border-right:1px solid var(--line);white-space:nowrap}
.seg b:last-child{border-right:0}.seg b.on{background:var(--selbg);color:var(--seltx)}
#presetbar{display:flex;align-items:center;gap:4px}
#pname{min-width:170px;text-align:center;background:var(--disp);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:14px;cursor:pointer;color:var(--acc4)}
#tabs{height:34px;display:flex;gap:2px;padding:4px 10px 0;background:var(--bg);flex:none;border-bottom:1px solid var(--line)}
#tabs b{padding:5px 16px;border-radius:6px 6px 0 0;background:var(--panel);color:var(--dim);cursor:pointer;font-size:14px;font-weight:700;letter-spacing:1.2px;border:1px solid var(--line);border-bottom:0}
#tabs b.on{background:var(--panel2);color:var(--acc);border-color:var(--selbd)}
#pages{height:620px;position:relative;flex:none}
.page{position:absolute;inset:0;padding:8px 10px;display:none;gap:8px}
.page.on{display:flex}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.pn>h3{margin:0;font-size:13px;letter-spacing:1.4px;color:var(--title);display:flex;align-items:center;gap:6px;font-weight:700}
.row{display:flex;gap:6px;align-items:flex-start;flex-wrap:nowrap}
.row.w{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:4px}
.cap{font-size:10px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase}
.knob{width:46px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize;position:relative;flex:none}
.knob canvas{width:40px;height:40px;display:block}
.knob .l{font-size:10px;color:var(--dim);line-height:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;max-width:46px;text-overflow:clip}
.knob .v{font-size:10px;color:var(--acc4);line-height:11px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.knob.hot canvas{outline:2px solid var(--acc);border-radius:50%}
.knob.sm{width:38px}.knob.sm canvas{width:32px;height:32px}
canvas.disp{background:var(--disp);border:1px solid var(--line);border-radius:5px;display:block}
.src{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:11px;background:var(--selbg);border:1px solid var(--selbd);color:var(--seltx);font-size:11px;font-weight:700;cursor:grab;letter-spacing:.5px;touch-action:none}
.src:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc)}
.src.e:before{background:var(--acc4)}.src.l:before{background:var(--m1)}.src.m:before{background:var(--acc2)}
#ghost{position:fixed;pointer-events:none;z-index:99;padding:2px 8px;border-radius:11px;background:var(--acc);color:#000;font-weight:700;font-size:12px;display:none}
#tip{position:fixed;z-index:100;max-width:260px;background:#000d;border:1px solid var(--selbd);color:#fff;padding:5px 8px;border-radius:6px;font-size:12px;line-height:14px;pointer-events:none;display:none}
#scopes{height:80px;display:flex;gap:8px;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line);flex:none}
#keys{height:90px;display:flex;gap:8px;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line);flex:none}
#kb{flex:1;position:relative;height:100%;background:#000;border-radius:4px;overflow:hidden}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(#f4f4f4,#cfcfcf);border:1px solid #222;border-radius:0 0 4px 4px}
.wk.dn{background:linear-gradient(var(--acc),#aaa)}
.bk{position:absolute;top:0;height:62%;background:linear-gradient(#333,#000);border:1px solid #000;border-radius:0 0 3px 3px;z-index:2}
.bk.dn{background:linear-gradient(var(--acc3),#222)}
.wheel{width:30px;height:100%;background:var(--disp);border:1px solid var(--line);border-radius:5px;position:relative;touch-action:none}
.wheel i{position:absolute;left:2px;right:2px;height:14px;background:var(--acc);border-radius:3px;opacity:.9}
#foot{height:22px;display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--dim);background:var(--bg);flex:none;gap:12px}
.hnd{position:fixed;z-index:50;background:transparent}
.dlg{position:fixed;inset:0;background:#000a;z-index:90;display:none;align-items:center;justify-content:center}
.dlg.on{display:flex}
.dlg>div{background:var(--panel);border:1px solid var(--selbd);border-radius:9px;padding:14px;min-width:360px;max-width:640px;max-height:90%;display:flex;flex-direction:column;gap:8px;overflow:hidden;font-size:13px}
.dlg h2{margin:0;color:var(--title);font-size:18px}
.dlg input[type=text],.dlg textarea{background:var(--disp);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:4px 6px;font:inherit;-webkit-user-select:text;user-select:text}
.dlg textarea{height:150px;font-family:'JetBrains Mono',monospace;font-size:11px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:11px;margin:1px}
.chip.on{background:var(--selbg);border-color:var(--selbd);color:var(--seltx)}
.list{background:var(--disp);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.list div{padding:2px 7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.list div:hover{background:var(--panel2)}.list div.on{background:var(--selbg);color:var(--seltx)}
.node{min-width:92px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;position:relative}
.node.on{border-color:var(--selbd)}.node.off{opacity:.5}
.node b{font-size:12px;color:var(--text);display:flex;justify-content:space-between;gap:4px}
.node .c{font-size:9px;color:var(--dim);text-transform:uppercase}
.lane{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:4px;display:flex;gap:4px;align-items:flex-start;min-height:60px;flex-wrap:wrap}

<script>
/* Whiskerwave DSP core, part 1: utils, FFT, parameter registry, wavetables.
   Pure JS. Wrapped in WWMAKE(G) so the same source runs in the page, the AudioWorklet and node tests.
   Mockup engine: preview quality. The C++ plugin oversamples and uses ADAA on nonlinear stages. */
function WWMAKE(G){
'use strict';
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const db2lin=d=>Math.pow(10,d/20), lin2db=x=>20*Math.log10(Math.max(x,1e-9));
const mtof=n=>440*Math.pow(2,(n-69)/12);
const lerp=(a,b,t)=>a+(b-a)*t;
G.util={clamp,db2lin,lin2db,mtof,lerp};

/* ---------- FFT (radix 2, in place, forward) ---------- */
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let len=2;len<=n;len<<=1){
    const ang=-TAU/len,wr=Math.cos(ang),wi=Math.sin(ang),h=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<h;k++){
      const a=i+k,b=a+h,xr=re[b]*cr-im[b]*ci,xi=re[b]*ci+im[b]*cr;
      re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi;
      const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t;}}
  }
}
function ifft(re,im){const n=re.length;fft(im,re);for(let i=0;i<n;i++){re[i]/=n;im[i]/=n;}}
G.fft=fft;G.ifft=ifft;

/* ---------- parameter registry ---------- */
const PR={};
function def(key,label,min,max,d,o){PR[key]=Object.assign({key,l:label,min,max,d,k:'lin',u:'',vo:false,tip:''},o||{});return PR[key];}
const toN=(key,v)=>{const p=PR[key];if(!p)return 0;
  if(p.k==='exp')return Math.log(Math.max(v,p.min)/p.min)/Math.log(p.max/p.min);
  return (v-p.min)/((p.max-p.min)||1);};
const fromN=(key,n)=>{const p=PR[key];n=clamp(n,0,1);
  if(p.k==='exp')return p.min*Math.pow(p.max/p.min,n);
  const v=p.min+n*(p.max-p.min);
  return (p.k==='int'||p.k==='list')?Math.round(v):v;};
G.PR=PR;G.toN=toN;G.fromN=fromN;G.def=def;

const LISTS={
 eng:['Wavetable','Sample','Granular'],
 warp:['Off','Sync','Bend +','Bend -','Bend +/-','PWM','Mirror','Asym','Quantize','Fold','Clip','Crush','Flip'],
 ustyle:['Classic','Supersaw','JP Super','Octaves','Power','Minor'],
 rt:['Dry','F1','F2','F1+F2'],
 msrc:['A','B','C','Sub','D','E','F'],
 mmode:['None','FM','AM','Ring'],
 ftype:['Off','LP 12','LP 24 Ladder','LP 18 Acid','HP 12','HP 24','BP','Notch','Peak','Comb +','Comb -','Formant','Phaser'],
 frt:['Serial','Parallel'],
 lshape:['Sine','Triangle','Saw Up','Saw Down','Square','S&H','Smooth Rnd','Custom','Rnd Steps 4','Rnd Steps 8','Rnd Slew','Rnd Walk','Rnd Noise','Rnd Gate','Rnd Ramp'],
 lmode:['Retrigger','Free (global)'],
 sync:['Hz','1/1','1/2','1/4','1/8','1/16','1/32','1/4T','1/8T','1/16T','1/4.','1/8.','1/16.'],
 vmode:['Poly','Mono','Legato'],
 subw:['Sine','Triangle','Square','Saw','Pulse','Half Sine','Soft Square','Organ','Parabola'],
 nzt:['White','Pink','Brown','Crackle','Blue','Violet','Dust','Sample and Hold','Vinyl','Wind'],
 arpm:['Up','Down','Up/Down','Random','As Played','Chord'],
 arpr:['1/4','1/8','1/16','1/32','1/8T','1/16T'],
 dest:['Master','Aux 1','Aux 2'],
 tdest:['Master','FX 1','FX 2','Track B','Track C','Sub/Noise'],xdest:['FX Out','Into FX 2'],
};
G.LISTS=LISTS;
const SYNCDIV=[0,4,2,1,.5,.25,.125,4/3,2/3,1/3,6,3,1.5]; // beats per cycle for sync list (index 1 = 4 beats)
SYNCDIV[1]=4;SYNCDIV[2]=2;SYNCDIV[3]=1;SYNCDIV[4]=.5;SYNCDIV[5]=.25;SYNCDIV[6]=.125;SYNCDIV[7]=2/3;SYNCDIV[8]=1/3;SYNCDIV[9]=1/6;SYNCDIV[10]=1.5;SYNCDIV[11]=.75;SYNCDIV[12]=.375;
G.SYNCDIV=SYNCDIV;

// global
def('master','Master',-60,6,-6,{u:' dB',tip:'Master output level before the limiter.'});
def('poly','Voices',1,32,16,{k:'int',tip:'Maximum number of notes playing at once, up to 32. Releasing notes are stolen first. More voices use more CPU only while they are playing.'});
def('vmode','Voice mode',0,2,0,{k:'list',list:'vmode',tip:'Poly plays chords. Mono plays one note with retrigger. Legato glides without retriggering envelopes.'});
def('glide','Glide',0,2000,0,{u:' ms',tip:'Portamento time between notes.',vo:true});

// oscillators A B C
for(const o of ['a','b','c','d','e','f']){

  def(o+'.pos','Wave Position',0,1,0,{vo:true,tip:'Scans through the frames of the wavetable. Modulate it for movement.'});
  def(o+'.w1','Warp 1',0,12,0,{k:'list',list:'warp',tip:'First warp mode. Reshapes the wave in time.'});
  def(o+'.w1a','Warp 1 amt',0,1,0,{vo:true,tip:'Amount of warp 1.'});

  def(o+'.sw','Spectral',-1,1,0,{tip:'Spectral warp of the whole table: negative stretches harmonics, positive shifts them. Static knob in this mockup.'});
  def(o+'.sk','Smear',0,1,0,{tip:'Spectral smear: blurs the harmonics together for a vocal, metallic or washed sound. Static knob in this mockup.'});
  def(o+'.oct','Octave',-4,4,0,{k:'int',tip:'Octave shift.'});
  def(o+'.semi','Semi',-48,48,0,{k:'int',tip:'Pitch shift in semitones, 0 in the centre, up to 4 octaves up or down. The < and > buttons next to it move by a whole octave; Ctrl, Cmd or Alt while dragging or scrolling the knob does the same.'});
  def(o+'.fine','Fine',-100,100,0,{u:' ct',vo:true,tip:'Fine tune in cents.'});
  def(o+'.lvl','Level',0,1,o==='a'?.75:.6,{vo:true,tip:'Oscillator level.'});
  def(o+'.pan','Pan',-1,1,0,{vo:true,tip:'Oscillator pan.'});
  def(o+'.ph','Phase',0,1,0,{tip:'Start phase.'});
  def(o+'.rnd','Rand',0,1,1,{tip:'Random start phase. 0 gives the same attack every note.'});
  def(o+'.uv','Unison',1,8,1,{k:'int',tip:'Number of stacked voices per note.'});
  def(o+'.ud','Detune',0,1,.25,{vo:true,tip:'Unison detune. The curve is slow at first and steep at the end.'});
  def(o+'.us','Style',0,5,0,{k:'list',list:'ustyle',tip:'Classic spreads evenly. Supersaw uses a centre voice plus detuned sides. Octaves, Power and Minor stack intervals. JP Super follows the measured JP-8000 curves: narrow detune until near the top, Blend trades the centre against the sides, and a high-pass at the note removes low rumble. Best with 7 voices.'});
  def(o+'.ub','Blend',0,1,.5,{vo:true,tip:'Centre voice against side voices.'});
  def(o+'.usp','Spread',0,1,.7,{vo:true,tip:'Stereo spread of the unison voices.'});
  def(o+'.anl','Analog',0,1,0,{tip:'Analog life for this oscillator. Each voice and unison voice gets a tiny fixed pitch offset plus a slow drift, like a real analog poly; filter cutoff and envelope times of the voice get a small spread too (the highest Analog of the playing oscillators sets that part). Chords and unison breathe and sound wider and warmer. At 100%: about 5 cents fixed, 3 cents drift, 3% cutoff, 5% envelope times. 0% is exact and digital.'});
  def(o+'.mm','Mod',0,3,0,{k:'list',list:'mmode',tip:'Let another oscillator modulate this one: FM, AM or ring.'});
  def(o+'.ms','Source',0,6,o==='a'?1:0,{k:'list',list:'msrc',tip:'Which oscillator is the modulator.'});
  def(o+'.ma','Mod amt',0,1,0,{vo:true,tip:'Amount of FM, AM or ring modulation.'});
  def(o+'.dv','Dive',-24,24,0,{u:' st',tip:'Pitch dive at note start. The note starts this far off and falls into tune. Used for hoover sounds.'});
  def(o+'.dt','Dive time',5,2000,120,{k:'exp',u:' ms',tip:'How long the dive takes.'});
  def(o+'.fb','Feedback',0,1,0,{vo:true,tip:'Feeds the oscillator output back into its own phase. Adds screech and growl.'});
  def(o+'.rt','Route',0,3,o==='a'?1:1,{k:'list',list:'rt',tip:'Send this oscillator to filter 1, filter 2, both or neither (dry).'});
  def(o+'.sroot','Root',24,96,60,{k:'int',tip:'Root key of the loaded sample.'});
  def(o+'.sloop','Loop',0,1,1,{k:'int',tip:'Loop the sample while the key is held.'});
  def(o+'.gp','Grain pos',0,1,0,{vo:true,tip:'Where in the sample the grains are read.'});
  def(o+'.gs','Grain size',5,500,80,{k:'exp',u:' ms',tip:'Length of each grain.'});
  def(o+'.gd','Density',1,60,16,{k:'exp',u:' /s',tip:'Grains per second.'});
  def(o+'.gj','Jitter',0,1,.2,{tip:'Random position spread of grains.'});
}
// sub and noise
def('s.sub','Sub',0,1,0,{k:'int',tip:'Turn the sub oscillator on or off.'});
def('s.sw','Sub wave',0,8,0,{k:'list',list:'subw',tip:'Sub oscillator waveform.'});
def('s.so','Sub oct',-4,1,-1,{k:'int',tip:'Sub octave below the key.'});
def('s.sl','Sub level',0,1,.5,{vo:true,tip:'Sub oscillator level.'});
def('s.nz','Noise',0,1,0,{k:'int',tip:'Turn the noise generator on or off.'});
def('s.nt','Noise type',0,9,0,{k:'list',list:'nzt',tip:'Ten noise colours and textures: white, pink, brown, crackle, blue, violet, dust, sample and hold, vinyl and wind.'});
def('s.nl','Noise level',0,1,.3,{vo:true,tip:'Noise level.'});
def('s.pk','Punch',0,1,0,{tip:'Short click at the start of each note.'});
def('s.rt','Route',0,3,0,{k:'list',list:'rt',tip:'Send sub and noise to filter 1, filter 2, both or neither.'});

def('s.sfn','Sub fine',-100,100,0,{u:' ct',vo:true,tip:'Fine tune of the sub in cents.'});
def('s.spn','Sub pan',-1,1,0,{vo:true,tip:'Sub position left or right.'});
def('s.sph','Sub phase',0,1,0,{vo:true,tip:'Start phase offset of the sub wave.'});
def('s.spw','Sub PW',.05,.95,.5,{vo:true,tip:'Pulse width, used by the Pulse wave.'});
def('s.sth','Sub thick',0,1,0,{vo:true,tip:'Adds two slightly detuned copies of the sub, one left and one right, for a wide fat low end. Keep it low for a clean mono sub.'});
def('s.sfm','Sub FM A',0,1,0,{vo:true,tip:'Oscillator A frequency-modulates the sub for growl and metallic lows.'});
def('s.sdr','Sub drive',0,1,0,{vo:true,tip:'Soft saturation adds harmonics so the sub is heard on small speakers.'});
def('s.skt','Key track',0,1,1,{k:'int',tip:'On: the sub follows the keyboard. Off: the sub stays at the fixed frequency.'});
def('s.sfh','Fixed Hz',20,200,55,{k:'exp',u:' Hz',vo:true,tip:'Sub frequency when key track is off.'});
def('s.srs','Retrig',0,1,0,{k:'int',tip:'On: the sub wave restarts at every note so every hit has the same punch.'});
def('s.srt','Sub route',0,3,0,{k:'list',list:'rt',tip:'Send the sub to filter 1, filter 2, both or neither.'});
def('s.npn','Noise pan',-1,1,0,{vo:true,tip:'Noise position left or right.'});
def('s.nw','Noise width',0,1,0,{vo:true,tip:'0 is mono noise. Higher values use different noise in each ear for a wide wash.'});
def('s.nhp','Noise HP',20,20000,20,{k:'exp',u:' Hz',vo:true,tip:'High-pass: removes low rumble from the noise.'});
def('s.nlp','Noise LP',20,20000,20000,{k:'exp',u:' Hz',vo:true,tip:'Low-pass: darkens the noise.'});
def('s.ntn','Noise tone',0,1,0,{vo:true,tip:'Turns the noise into a pitched whistle that follows the key, like breath or wind over a bottle.'});
def('s.nd','Density',0,1,.25,{vo:true,tip:'How many crackles, dust specks or pops per second.'});
def('s.nr','S&H rate',50,20000,4000,{k:'exp',u:' Hz',vo:true,tip:'Step rate of the Sample and Hold noise.'});
// filters
for(const f of ['f1','f2']){
  const n=f==='f1'?1:2;
  def(f+'.type','Filter '+n,0,12,f==='f1'?2:0,{k:'list',list:'ftype',tip:'Filter '+n+' type.'});
  def(f+'.cut','Cutoff',20,20000,f==='f1'?9000:12000,{k:'exp',u:' Hz',vo:true,tip:'Cutoff frequency (or comb pitch, formant vowel position).'});
  def(f+'.res','Reso',0,1,.2,{vo:true,tip:'Resonance. Ladder and acid types can self oscillate near the top.'});
  def(f+'.drv','Drive',0,1,0,{vo:true,tip:'Filter drive. Level is compensated so louder does not fool you.'});
  def(f+'.kt','Key track',-1,1,.25,{tip:'How much the cutoff follows the key. 100% follows exactly. Higher opens the filter more on high notes.'});
  def(f+'.env','Env amt',-1,1,0,{vo:true,tip:'How far the chosen envelope opens the cutoff, up to 5 octaves.'});
  def(f+'.es','Envelope',0,16,2,{k:'list',list:'fenvsel',tip:'Which envelope moves this filter. None means no envelope on this filter. Pick Env 1 to 16 to attach one; edit it in the envelope bank.'});
  def(f+'.mix','Mix',0,1,1,{vo:true,tip:'Dry and filtered mix.'});
}
def('frt','Routing',0,1,0,{k:'list',list:'frt',tip:'Serial runs filter 1 into filter 2. Parallel runs both and adds them.'});
// envelopes
for(let i=1;i<=16;i++){
  const d=[[2,0,400,.7,180],[2,0,550,.35,200],[5,0,300,0,300],[2,0,120,0,100],[3,0,350,.5,300],[3,0,250,0,250],[40,0,600,.6,500],[1,0,80,0,80]][i-1]||[5,0,300,0,300];
  def('e'+i+'.a','Attack',0.5,10000,d[0],{k:'exp',u:' ms',tip:'Envelope '+i+' attack time.'});

}

}
for(let i=1;i<=8;i++)def('m'+i,'Macro '+i,0,1,0,{vo:true,tip:'Macro '+i+': a fast control. Drag its circle onto any knobs, then turn this one knob to move them all.'});
// arp

/* ---------- wavetable ---------- */
const N=2048;
class WT{
  constructor(name,cat,frames){this.name=name;this.cat=cat;this.src=frames;this.nf=frames.length;this.lv=null;this.sw=0;this.sk=0;}
  spectra(){ // forward FFT of every frame, cached
    if(this._sp)return this._sp;
    const sp=[];for(const fr of this.src){const re=new Float64Array(N),im=new Float64Array(N);for(let i=0;i<N;i++)re[i]=fr[i];fft(re,im);sp.push([re,im]);}
    return this._sp=sp;}
  build(sw,sk){
    sw=sw||0;sk=sk||0;this.sw=sw;this.sk=sk;
    const sp=this.spectra(),H=N/2,lv=[];
    // spectral warp: stretch (<0) or shift (>0) harmonics; smear blurs magnitudes
    const warped=sp.map(([re,im])=>{
      if(!sw&&!sk)return [re,im];
      const r2=new Float64Array(N),i2=new Float64Array(N);
      for(let k=1;k<H;k++){
        let src;
        if(sw<0)src=k*(1+sw*0.9); else src=k-sw*24;
        if(src<1||src>=H-1)continue;
        const a=Math.floor(src),f=src-a;
        r2[k]=re[a]*(1-f)+re[a+1]*f;i2[k]=im[a]*(1-f)+im[a+1]*f;}
      if(sk>0){const w=Math.max(1,Math.round(sk*5));
        for(let k=1;k<H;k++){let sr=0,si=0,c=0;for(let j=-w;j<=w;j++){const q=k+j;if(q<1||q>=H)continue;sr+=r2[q];si+=i2[q];c++;}
          r2[k]=r2[k]*(1-sk)+sk*sr/c;i2[k]=i2[k]*(1-sk)+sk*si/c;}}
      for(let k=1;k<H;k++){r2[N-k]=r2[k];i2[N-k]=-i2[k];}
      return [r2,i2];});
    for(let m=0;m<11;m++){

/* Smooth lookahead limiter: gain only, no waveshaping. A sliding minimum of the needed gain is smoothed by a box average so the
   gain change is a ramp over the lookahead, and the audio is delayed by the same time, so every peak is already turned down when it arrives. */
class LookLim{
  constructor(sr){this.sr=sr||44100;this.N=Math.max(16,Math.round(this.sr*.005));const M=this.N+1;this.M=M;this.H=Math.round(this.sr*.025);this.hc=0;
    this.dl=new Float32Array(M);this.dr=new Float32Array(M);this.w=0;
    this.tg=new Float64Array(M);this.dq=new Float64Array(M+2);this.qh=0;this.qt=0;this.cnt=0;
    this.bx=new Float64Array(M).fill(1);this.bsum=M;this.bw=0;this.rel=1;this.gr=0;}
  proc(L,R,n,ce,relMs){const M=this.M,Q=M+2,rc=Math.exp(-1/(this.sr*Math.max(5,relMs)*.001)),tg=this.tg,dq=this.dq;let gmin=1;
    for(let i=0;i<n;i++){
      const l=L[i],r=R[i],pk=Math.max(Math.abs(l),Math.abs(r)),x=pk>ce?ce/pk:1,t=this.cnt++;
      tg[t%M]=x;
      while(this.qt>this.qh&&tg[dq[(this.qt-1)%Q]%M]>=x)this.qt--;
      dq[this.qt%Q]=t;this.qt++;
      while(dq[this.qh%Q]<=t-M)this.qh++;
      const wm=tg[dq[this.qh%Q]%M];
      const bi=this.bw;this.bsum+=wm-this.bx[bi];this.bx[bi]=wm;this.bw=(bi+1)%M;
      const g=this.bsum/M;
      if(g<this.rel){this.rel=g;this.hc=this.H;}else if(this.hc>0)this.hc--;else this.rel+=(g-this.rel)*(1-rc); // 25 ms hold: gain does not ride each bass cycle
      const go=this.rel;
      const wi=this.w,dl=this.dl[wi],dr=this.dr[wi];this.dl[wi]=l;this.dr[wi]=r;this.w=(wi+1)%M;
      let ol=dl*go,or_=dr*go;if(ol>ce)ol=ce;else if(ol<-ce)ol=-ce;if(or_>ce)or_=ce;else if(or_<-ce)or_=-ce;
      L[i]=ol;R[i]=or_;if(go<gmin)gmin=go;}
    this.gr=20*Math.log10(gmin);}
}

const tri=x=>{if(x<=1&&x>=-1)return x;let y=((x+1)%4+4)%4;return y<2?y-1:3-y;};
function shp(t,x){
  switch(t){
    case 0:return Math.tanh(x);
    case 1:return x>1?1:x<-1?-1:x;
    case 2:return x>=0?Math.tanh(x):Math.tanh(x*.6)*1.3;
    case 3:return tri(x);
    case 4:return Math.atan(x*1.5)*.64;
    case 5:return x>=0?1-Math.exp(-x):-(1-Math.exp(x*.7))*.7;
    case 6:return Math.abs(Math.tanh(x))*1.2-.4;
    case 7:return Math.sin(x*1.5);
    case 8:return (x<0?-1:1)*(1-Math.exp(-Math.abs(x)*3));
    default:return x>=0?Math.tanh(x*1.5):x/(1+Math.abs(x)*2);}
}

/* ================= Bitcrusher ================= */
class FxCrush{constructor(E){this.E=E;this.h=[0,0];this.c=0;this.nx=1;this.lp=[new BiS(),new BiS()];}
  proc(L,R,n,P){const sr=this.E.sr,bits=P('bits'),q=Math.pow(2,bits-1),red=P('rate'),jit=P('jitter'),dith=P('dither'),sm=P('smooth');
    this.lp[0].set('lp',clamp(sr/Math.max(red,1)*.45*(1+(1-sm)*20),200,sr*.45),.7071,0,sr);this.lp[1].set('lp',clamp(sr/Math.max(red,1)*.45*(1+(1-sm)*20),200,sr*.45),.7071,0,sr);
    for(let i=0;i<n;i++){this.c+=1;
      if(this.c>=this.nx){this.c-=this.nx;this.nx=red*(1+jit*(Math.random()*2-1)*.5);
        for(let ch=0;ch<2;ch++){const x=(ch?R:L)[i],d=dith*(Math.random()-Math.random())/q;this.h[ch]=Math.round((x+d)*q)/q;}}
      for(let ch=0;ch<2;ch++){let y=this.h[ch];if(sm>0)y=this.lp[ch].p(ch,y)*sm+y*(1-sm);(ch?R:L)[i]=y;}}}}

 ['bits','Bits',1,16,8,{k:'int',tip:'Bit depth. Lower is rougher.'}],['rate','Downsample',1,64,1,{k:'exp',tip:'Keeps every Nth sample. Higher is more aliasing and grit.'}],
 ['jitter','Jitter',0,1,0,{tip:'Randomises the sample timing for a noisy, broken sound.'}],['dither','Dither',0,1,0,{tip:'Adds noise before crushing so quiet parts stay alive.'}],['smooth','Smooth',0,1,0,{tip:'Low-passes the steps for a softer, tape-like crush.'}]
],FxCrush,1);

/* ================= Wavefolder ================= */
class FxFolder{constructor(E){this.E=E;this.os=[new OS4(),new OS4()];this.tl=[new BiS(),new BiS()];this.dc=[0,0];}
  proc(L,R,n,P){const sr=this.E.sr,dg=dbv(P('drive')),st=P('stages'),sym=P('sym')*.5,og=dbv(P('level'));
    this.tl[0].set('lp',P('tone'),.7071,0,sr);this.tl[1].set('lp',P('tone'),.7071,0,sr);for(const o of this.os)o.prep(sr);
    const fn=(x,a,b)=>{let y=x+b;for(let k=0;k<a;k++)y=tri(y*1.15);return y;};
    for(let i=0;i<n;i++)for(let c=0;c<2;c++){const X=c?R:L;let y=this.os[c].p(c,X[i]*dg,fn,st,sym);y=this.tl[c].p(c,y);this.dc[c]+=DCB*(y-this.dc[c]);X[i]=(y-this.dc[c])*og;}}
  alignDry(L,R,n){for(let i=0;i<n;i++){L[i]=this.os[0].lin(0,L[i]);R[i]=this.os[1].lin(1,R[i]);}}}

/* ================= Frequency shifter (Hilbert allpass pairs) ================= */
const HA=[.6923878,.9360654322959,.9882295226860,.9987488452737],HB=[.4021921162426,.8561710882420,.9722909545651,.9952884791278];
class Hilb{constructor(){this.sa=new Float64Array(16);this.sb=new Float64Array(16);this.d=0;}
  p(x){let a=x,b=this.d;this.d=x;
    for(let k=0;k<4;k++){const c=HA[k]*HA[k],o=k*4,s=this.sa;const y=c*(a+s[o+3])-s[o+1];s[o+1]=s[o];s[o]=a;s[o+3]=s[o+2];s[o+2]=y;a=y;}
    for(let k=0;k<4;k++){const c=HB[k]*HB[k],o=k*4,s=this.sb;const y=c*(b+s[o+3])-s[o+1];s[o+1]=s[o];s[o]=b;s[o+3]=s[o+2];s[o+2]=y;b=y;}
    this.i=a;this.q=b;}}
class FxFShift{constructor(E){this.E=E;this.h=[new Hilb(),new Hilb()];this.ph=0;this.fb=[0,0];}
  proc(L,R,n,P){const sr=this.E.sr,sh=P('shift'),fbk=P('fb'),w=TAU*sh/sr,sd=P('spread');
    for(let i=0;i<n;i++){const c=Math.cos(this.ph),s=Math.sin(this.ph);
      for(let ch=0;ch<2;ch++){const X=ch?R:L,h=this.h[ch];h.p(X[i]+fbk*this.fb[ch]);
        const sg=ch?1-sd*4:1;const y=h.i*c+h.q*s*sg;this.fb[ch]=Math.tanh(y);X[i]=y;}
      this.ph+=w;if(this.ph>TAU)this.ph-=TAU;else if(this.ph<-TAU)this.ph+=TAU;}}}

 ['fb','Feedback',0,.9,0,{tip:'Feeds the output back in for rising or falling spirals.'}],['spread','Stereo',0,.5,0,{tip:'Shifts left and right in opposite directions for width.'}]
],FxFShift,.5);

  proc(L,R,n,P){const sr=this.E.sr,f=P('freq'),w=P('wave'),inc=f/sr/4;let ph=this.ph;for(const o of this.os)o.prep(sr);
    const fn=(x)=>{const m=wave4(w,ph);ph+=inc;if(ph>=1)ph-=1;return x*m;};

const FMT=[[800,1150,2900],[400,1600,2700],[270,2140,2950],[450,830,2830],[325,700,2530]];
const vtanh=(x,dg)=>Math.tanh(x*dg)/Math.sqrt(dg);
class FxVowel{constructor(E){this.E=E;this.os=[new OS4(),new OS4()];this.b=[0,1,2].map(()=>new BiS());}
  proc(L,R,n,P){const sr=this.E.sr;for(const o of this.os)o.prep(sr);const v=clamp(P('vowel'),0,4),i=Math.min(3,Math.floor(v)),f=v-i,sh=Math.pow(2,P('shift')),q=3+P('res')*14,dg=dbv(P('drive')),og=dbv(P('gain'));
    for(let k=0;k<3;k++)this.b[k].set('bp',(FMT[i][k]*(1-f)+FMT[i+1][k]*f)*sh,q*(k===0?.8:1.1),0,sr);
    const w=[1,.65,.4];
    for(let j=0;j<n;j++)for(let c=0;c<2;c++){const X=c?R:L,x=dg>1.01?this.os[c].p(c,X[j],vtanh,dg,0):X[j];let s=0;for(let k=0;k<3;k++)s+=w[k]*this.b[k].p(c,x);X[j]=s*og*1.6;}}}

 ['res','Sharpness',0,1,.5,{tip:'Narrower formants sound more vocal and more nasal.'}],['drive','Drive',0,24,0,{u:' dB',tip:'Saturation before the formants for a growling voice.'}],['gain','Gain',-12,12,0,{u:' dB',tip:'Output level.'}]
],FxVowel,1);

class FxChorus{constructor(E){this.E=E;const m=Math.floor(E.sr*.06);this.d=[new Delay(m),new Delay(m)];this.ph=0;this.hp=new BiS();this.fbs=[0,0];}
  proc(L,R,n,P){const E=this.E,sr=E.sr,mode=P('mode'),nv=[1,3,2,1][mode],base=P('delay')*.001*sr,dep=P('depth'),fb=P('fb'),w=P('spread'),inc=rateOf(E,P)/sr;
    this.hp.set('hp',P('hp'),.7071,0,sr);let ph=this.ph;
    for(let i=0;i<n;i++){let oL=0,oR=0;
      for(let c=0;c<2;c++){const X=c?R:L,x=this.hp.p(c,X[i]);this.d[c].write(x+this.fbs[c]*fb);let s=0;
        for(let v=0;v<nv;v++){const p=(ph+v/nv+c*.5)%1,lf=mode===2?Math.sin(TAU*p)*.5+Math.sin(TAU*p*3.1)*.1:Math.sin(TAU*p),d=Math.max(1.5,base*(1+dep*.85*lf));s+=this.d[c].read(d-1);}
        s/=Math.sqrt(nv);this.fbs[c]=s;if(c)oR=s;else oL=s;}
      const m=(oL+oR)*.5,sd=(oL-oR)*.5*w*2;L[i]=m+sd;R[i]=m-sd;ph+=inc;if(ph>=1)ph-=1;}
    this.ph=ph;}}

class FxFlanger{constructor(E){this.E=E;const m=Math.floor(E.sr*.02);this.d=[new Delay(m),new Delay(m)];this.ph=0;this.y=[0,0];}
  proc(L,R,n,P){const E=this.E,sr=E.sr,base=P('delay')*.001*sr,dep=P('depth'),fb=P('fb'),inc=rateOf(E,P)/sr,sp=P('spread')*.5;let ph=this.ph;
    for(let i=0;i<n;i++){for(let c=0;c<2;c++){const X=c?R:L,x=X[i],lf=.5-.5*Math.cos(TAU*((ph+c*sp)%1)),d=Math.max(1,base*(.2+1.6*dep*lf)+base*.1);
        this.d[c].write(x+Math.tanh(fb*this.y[c]));const y=this.d[c].read(d-1);this.y[c]=y;X[i]=y;}
      ph+=inc;if(ph>=1)ph-=1;}
    this.ph=ph;}}

/* ================= Phaser ================= */
class FxPhaser{constructor(E){this.E=E;this.x1=new Float64Array(24);this.y1=new Float64Array(24);this.a=new Float64Array(12);this.ph=0;this.fb=[0,0];}
  proc(L,R,n,P){const E=this.E,sr=E.sr,ns=[4,6,8,12][P('stages')],cf=P('freq'),dep=P('depth'),fbk=P('fb'),sp=P('spread'),inc=rateOf(E,P)/sr;let ph=this.ph;
    const A=this.a;
    for(let i=0;i<n;i++){
      if((i&15)===0){const lf=Math.sin(TAU*ph);for(let k=0;k<ns;k++){const f=clamp(cf*Math.pow(2,dep*2.2*lf)*(1+k*sp*.35),30,sr*.45),t=Math.tan(PI*f/sr);A[k]=(t-1)/(t+1);}}
      for(let c=0;c<2;c++){const X=c?R:L,o=c*12;let y=X[i]+fbk*this.fb[c];
        for(let k=0;k<ns;k++){const a=A[k],o2=o+k,out=a*y+this.x1[o2]-a*this.y1[o2];this.x1[o2]=y;this.y1[o2]=out;y=out;}
        this.fb[c]=Math.tanh(y);X[i]=y;}
      ph+=inc;if(ph>=1)ph-=1;}
    this.ph=ph;}}

class FxTrem{constructor(E){this.E=E;this.ph=0;}
  proc(L,R,n,P){const E=this.E,inc=rateOf(E,P)/E.sr,dep=P('depth'),sh=P('shape'),ap=P('mode'),st=P('stereo')*.5;let ph=this.ph;
    for(let i=0;i<n;i++){const a=wave4(sh,ph),b=wave4(sh,(ph+st)%1);
      if(ap===0){L[i]*=1-dep*.5*(1-a);R[i]*=1-dep*.5*(1-b);}
      else{const p=a*dep,gl=Math.cos((p*.5+.5)*PI/2)*1.414,gr=Math.sin((p*.5+.5)*PI/2)*1.414;L[i]*=gl;R[i]*=gr;}
      ph+=inc;if(ph>=1)ph-=1;}
    this.ph=ph;}}

/* ================= Delay ================= */
const dsat=(x,g,nn)=>Math.tanh(x*g)*nn;
class FxDelay{constructor(E){this.E=E;const m=Math.floor(E.sr*4)+16;this.dl=[new Delay(m),new Delay(m)];this.tl=0;this.tr=0;this.init=false;
  this.hp=[new BiS(),new BiS()];this.lp=[new BiS(),new BiS()];this.wp=0;this.y=[0,0];this.os=[new OS2(),new OS2()];}
  proc(L,R,n,P){const E=this.E,sr=E.sr,beat=60000/E.pv.bpm,mode=P('mode'),sl=P('syncl'),srr=P('syncr');
    const msL=sl>0?beat*SYNCDIV[sl]:P('timel'),msR=mode===3?(srr>0?beat*SYNCDIV[srr]:P('timer')):msL;
    const tape=mode===2,fb=Math.min(.98,P('fb')),sat=Math.max(P('sat'),tape?.35:0),wow=Math.max(P('wow'),tape?.3:0),hc=tape?Math.min(P('hc'),5500):P('hc');
    for(let c=0;c<2;c++){this.hp[c].set('hp',P('lc'),.7071,0,sr);this.lp[c].set('lp',hc,.7071,0,sr);}
    const tgL=clamp(msL*sr*.001,8,sr*3.9),tgR=clamp(msR*sr*.001,8,sr*3.9);
    if(!this.init){this.tl=tgL;this.tr=tgR;this.init=true;}
    const k=.0012,satg=1+sat*3,satn=1/(1+sat*1.2);let wp=this.wp;for(const o of this.os)o.prep(sr);
    for(let i=0;i<n;i++){
      this.tl+=(tgL-this.tl)*k;this.tr+=(tgR-this.tr)*k;
      const wl=wow>0?1+wow*.004*Math.sin(TAU*wp):1,wr=wow>0?1+wow*.004*Math.sin(TAU*wp*1.13+1):1;wp+=.6/sr;if(wp>1)wp-=1;
      const yl=this.dl[0].read(this.tl*wl-1),yr=this.dl[1].read(this.tr*wr-1);
      let fl=yl,fr=yr;
      fl=this.lp[0].p(0,this.hp[0].p(0,fl));fr=this.lp[1].p(1,this.hp[1].p(1,fr));
      if(sat>0){fl=this.os[0].p(0,fl,dsat,satg,satn);fr=this.os[1].p(1,fr,dsat,satg,satn);}
      if(mode===1){const m=(L[i]+R[i])*.5;this.dl[0].write(m+fb*fr);this.dl[1].write(fb*fl);}
      else{this.dl[0].write(L[i]+fb*fl);this.dl[1].write(R[i]+fb*fr);}
      L[i]=yl;R[i]=yr;}
    this.wp=wp;}}

    if(!this.init){for(let k=0;k<4;k++)this.t[k]=tg[k];this.init=true;}
    for(let i=0;i<n;i++){let oL=0,oR=0,sum=0;

        const a=(pn[k]*.5+.5)*PI/2;oL+=y*Math.cos(a)*1.414;oR+=y*Math.sin(a)*1.414;}
      const m=(L[i]+R[i])*.5,f=this.lp.p(0,this.hp.p(0,sum));this.d.write(m+fb*Math.tanh(f));L[i]=oL;R[i]=oR;}}}

/* ================= Pitch shifter ================= */
class PS{constructor(sr){this.W=Math.floor(sr*.05);this.d=new Delay(this.W*2+16);this.ph=0;}
  setW(sr,ms){this.W=Math.max(64,Math.floor(sr*ms*.001));}
  p(x,r){this.d.write(x);this.ph+=(1-r)/this.W;this.ph-=Math.floor(this.ph);
    const p2=(this.ph+.5)%1,s1=Math.sin(PI*this.ph),s2=Math.sin(PI*p2);
    return this.d.read(this.ph*this.W)*s1*s1+this.d.read(p2*this.W)*s2*s2;}}
class FxPitch{constructor(E){this.E=E;this.p=[new PS(E.sr),new PS(E.sr)];this.fb=[0,0];}
  proc(L,R,n,P){const sr=this.E.sr,r=Math.pow(2,(P('semi')+P('fine')/100)/12),w=P('win'),fbk=P('fb');
    for(const p of this.p)p.setW(sr,w);
    for(let i=0;i<n;i++){for(let c=0;c<2;c++){const X=c?R:L,y=this.p[c].p(X[i]+this.fb[c]*fbk,r);this.fb[c]=Math.tanh(y);X[i]=y;}}}}

 ['semi','Semitones',-24,24,12,{k:'int',u:' st',tip:'Shift in semitones. 12 is one octave up.'}],['fine','Fine',-100,100,0,{u:' ct',tip:'Fine tune in cents.'}],
 ['win','Window',20,120,50,{u:' ms',tip:'Grain size. Short is tight but grainy, long is smoother but smears.'}],['fb','Feedback',0,.8,0,{tip:'Feeds the shifted sound back in for endless rising or falling pitch.'}]
],FxPitch,.5);

/* ================= Reverb (FDN with ten characters) ================= */
const VBASE=[1087,1283,1471,1699,1949,2203,2467,2749];
const VTYPES=[ // name, size, diffusion, mod, early reflections
 ['Room',.45,.6,.15,.9],['Plate',.8,.8,.3,0],['Hall',1.4,.7,.3,.4],['Cathedral',2.6,.75,.35,.2],['Chamber',.7,.65,.2,.6],
 ['Spring',.35,.3,.05,0],['Shimmer',1.6,.75,.45,0],['Gated',.8,.7,.2,.3],['Bloom',1.8,.8,.4,0],['Ambient',2.0,.85,.6,0]];
const ERT=[11,17,23,31,43,59],ERG=[.7,.6,.5,.45,.35,.3];
class AP1{constructor(max){this.d=new Delay(max);}
  p(x,D,g){const z=this.d.read(D-1),w=x+g*z;this.d.write(w);return z-g*w;}}
class FxVerb{
  constructor(E){this.E=E;const sr=E.sr,m=Math.floor(16384*sr/44100)+64;
    this.ln=[];for(let i=0;i<8;i++)this.ln.push(new Delay(m));
    this.lps=new Float64Array(8);this.lph=new Float64Array(8);for(let i=0;i<8;i++)this.lph[i]=i*.37;
    this.apl=[0,1,2,3].map(()=>new AP1(2048));this.apr=[0,1,2,3].map(()=>new AP1(2048));
    this.spl=[0,1,2,3,4,5].map(()=>new AP1(512));this.spr=[0,1,2,3,4,5].map(()=>new AP1(512));
    this.pre=[new Delay(Math.floor(sr*.55)),new Delay(Math.floor(sr*.55))];
    this.hp=[new BiS(),new BiS()];this.ps=new PS(sr);this.sh=0;this.gate=0;this.hold=0;this.env=0;this.swell=0;this.mo=new Float64Array(8);
    this.dl=new Float64Array(8);this.o=new Float64Array(8);this.gn=new Float64Array(8);this.ty=-1;}
  proc(L,R,n,P){const E=this.E,sr=E.sr,k=sr/44100,ty=P('type'),T=VTYPES[ty],size=P('size'),rt=P('decay'),pd=P('pre')*.001*sr,diff=clamp(T[2]*(.6+.6*P('diff')),.1,.86),md=T[3]*P('mod'),er=T[4]*P('early'),wid=P('width'),shim=P('shim');
    const scale=T[1]*(.5+size)*k;
    for(let i=0;i<8;i++){this.dl[i]=Math.max(32,Math.floor(VBASE[i]*scale));this.gn[i]=Math.pow(10,-3*this.dl[i]/(sr*rt));}
    const dk=1-Math.exp(-TAU*P('damp')/sr),hpf=P('lc');for(let c=0;c<2;c++)this.hp[c].set('hp',hpf,.7071,0,sr);
    const aps=[142,107,379,277].map(x=>Math.max(8,Math.floor(x*k*(.6+.5*size)))),spd=[37,53,71,89,107,131].map(x=>Math.floor(x*k));
    const lfi=[.11,.17,.23,.29,.13,.19,.31,.37];
    const lm=ty===7,bl=ty===8,sp=ty===5,shm=ty===6;
    const holdS=sr*(.08+size*.4),sq=1/Math.sqrt(8);
    for(let i=0;i<n;i++){
      let xl=L[i],xr=R[i];
      this.pre[0].write(xl);this.pre[1].write(xr);
      let pl=pd>1?this.pre[0].read(pd-1):xl,pr=pd>1?this.pre[1].read(pd-1):xr;
      // level for gate and bloom
      const lv=Math.max(Math.abs(xl),Math.abs(xr));
      if(lm){if(lv>.01)this.hold=holdS;else if(this.hold>0)this.hold--;this.gate+=((this.hold>0?1:0)-this.gate)*(this.hold>0?.01:.0015);}
      if(bl){this.swell+=((lv>.005?1:0)-this.swell)*(lv>.005?.00015:.00006);}
      let er_l=0,er_r=0;
      if(er>0){for(let t=0;t<6;t++){const d=Math.floor(ERT[t]*.001*sr*(.5+size)+Math.max(0,pd));const a=this.pre[t&1].read(d);if(t&1)er_r+=a*ERG[t];else er_l+=a*ERG[t];}
        er_l*=er;er_r*=er;}
      let il=pl,ir=pr;
      if(shm){il+=this.sh*shim*.5;ir+=this.sh*shim*.5;}
      if(sp){for(let s=0;s<6;s++){il=this.spl[s].p(il,spd[s],.62);ir=this.spr[s].p(ir,spd[s]+3,.62);}}
      for(let s=0;s<4;s++){il=this.apl[s].p(il,aps[s],diff);ir=this.apr[s].p(ir,aps[s]+11,diff);}
      if(bl){il*=this.swell;ir*=this.swell;}
      const o=this.o;
      for(let j=0;j<8;j++){
        this.lph[j]+=lfi[j]/sr;if(this.lph[j]>1)this.lph[j]-=1;
        const mod=md>0?Math.sin(TAU*this.lph[j])*md*10*k:0;
        let v=this.ln[j].read(this.dl[j]+mod-1);
        this.lps[j]+=dk*(v-this.lps[j]);o[j]=this.lps[j];}
      // output taps
      let oL=(o[0]+o[2]+o[4]+o[6])*.4,oR=(o[1]+o[3]+o[5]+o[7])*.4;
      // hadamard 8
      let a0=o[0]+o[1],a1=o[0]-o[1],a2=o[2]+o[3],a3=o[2]-o[3],a4=o[4]+o[5],a5=o[4]-o[5],a6=o[6]+o[7],a7=o[6]-o[7];
      let b0=a0+a2,b1=a1+a3,b2=a0-a2,b3=a1-a3,b4=a4+a6,b5=a5+a7,b6=a4-a6,b7=a5-a7;
      const m0=(b0+b4)*sq,m1=(b1+b5)*sq,m2=(b2+b6)*sq,m3=(b3+b7)*sq,m4=(b0-b4)*sq,m5=(b1-b5)*sq,m6=(b2-b6)*sq,m7=(b3-b7)*sq;
      const g=this.gn;
      this.ln[0].write(il*.5+g[0]*m0);this.ln[1].write(ir*.5+g[1]*m1);this.ln[2].write(il*.5+g[2]*m2);this.ln[3].write(ir*.5+g[3]*m3);
      this.ln[4].write(il*.5+g[4]*m4);this.ln[5].write(ir*.5+g[5]*m5);this.ln[6].write(il*.5+g[6]*m6);this.ln[7].write(ir*.5+g[7]*m7);
      let wl=oL+er_l,wr=oR+er_r;
      if(shm)this.sh=this.ps.p((wl+wr)*.5,2);
      if(lm){wl*=this.gate;wr*=this.gate;}
      const mm=(wl+wr)*.5,ss=(wl-wr)*.5*wid*2;wl=mm+ss;wr=mm-ss;
      L[i]=this.hp[0].p(0,wl);R[i]=this.hp[1].p(1,wr);}}}

/* ================= Disperser ================= */
class FxDisp{constructor(E){this.E=E;this.x1=new Float64Array(128);this.y1=new Float64Array(128);this.a=new Float64Array(128);this.b=new Float64Array(128);this.fb=[0,0];}
  proc(L,R,n,P){const sr=this.E.sr,ns=P('amount'),fc=P('freq'),pin=Math.pow(2,P('pinch')*1.5),spr=P('spread'),fbk=P('fb'),oct=P('range');
    for(let k=0;k<ns;k++){const u=(k+.5)/ns*2-1,w=(u<0?-1:1)*Math.pow(Math.abs(u),pin);
      for(let c=0;c<2;c++){const f=clamp(fc*Math.pow(2,w*oct)*(c?1+spr*.6:1),20,sr*.45),t=Math.tan(PI*f/sr);(c?this.b:this.a)[k]=(t-1)/(t+1);}}
    for(let i=0;i<n;i++)for(let c=0;c<2;c++){const X=c?R:L,A=c?this.b:this.a,o=c*64;let y=X[i]+fbk*this.fb[c];
      for(let k=0;k<ns;k++){const a=A[k],j=o+k,out=a*y+this.x1[j]-a*this.y1[j];this.x1[j]=y;this.y1[j]=out;y=out;}
      this.fb[c]=Math.tanh(y*.9);X[i]=y;}}}

 ['pinch','Pinch',-1,1,0,{tip:'Bunches the stages near the frequency (positive) or spreads them out (negative).'}],['range','Range',.5,5,3,{u:' oct',tip:'How wide the stages are spread around the frequency.'}],

class FxImage{constructor(E){this.E=E;this.hp=new BiS();}
  proc(L,R,n,P){const sr=this.E.sr,w=P('width'),bm=P('bass'),pn=P('pan'),mg=dbv(P('mid')),sg=dbv(P('side')),gl=Math.cos((pn*.5+.5)*PI/2)*1.414,gr=Math.sin((pn*.5+.5)*PI/2)*1.414;
    if(bm>25)this.hp.set('hp',bm,.7071,0,sr);
    for(let i=0;i<n;i++){const m=(L[i]+R[i])*.5;let s=(L[i]-R[i])*.5;
      if(bm>25)s=this.hp.p(0,s);
      s*=w*sg;L[i]=(m*mg+s)*gl;R[i]=(m*mg-s)*gr;}}}

/* ================= Haas widener ================= */
class FxHaas{constructor(E){this.E=E;this.d=new Delay(Math.floor(E.sr*.04));this.al=[0,1,2,3].map(()=>new AP1(512));this.ar=[0,1,2,3].map(()=>new AP1(512));}
  proc(L,R,n,P){const sr=this.E.sr,t=P('time')*.001*sr,dec=P('decor'),side=P('side');
    const dl=[23,37,53,71].map(x=>Math.floor(x*sr/44100)),dr=[29,43,61,83].map(x=>Math.floor(x*sr/44100)),g=.5*dec;
    for(let i=0;i<n;i++){let l=L[i],r=R[i];
      if(dec>0){for(let k=0;k<4;k++){l=this.al[k].p(l,dl[k],g);r=this.ar[k].p(r,dr[k],-g);}}
      if(t>1){const X=side===0?l:r;this.d.write(X);const y=this.d.read(t-1);if(side===0)l=y;else r=y;}
      L[i]=l;R[i]=r;}}}

 ['time','Haas time',0,30,12,{u:' ms',tip:'Delay on one side. 5 to 20 ms widens without a clear echo.'}],['side','Delayed side',0,0,1,{list:['Left','Right'],tip:'Which side is delayed.'}],['decor','Decorrelate',0,1,.4,{tip:'Smears left and right differently for a wider, softer image.'}]
],FxHaas,.6);

/* ================= Utility ================= */
class FxUtil{constructor(E){this.E=E;this.dc=[0,0];this.g=1;}
  proc(L,R,n,P){const g=P('gain')<=-60?0:dbv(P('gain')),pn=P('pan'),gl=Math.cos((pn*.5+.5)*PI/2)*1.414,gr=Math.sin((pn*.5+.5)*PI/2)*1.414,mono=P('mono'),inv=P('invert'),sw=P('swap'),dcf=P('dc');
    const sm=1-Math.exp(-1/(this.E.sr*.004));let cg=this.g;
    for(let i=0;i<n;i++){let l=L[i],r=R[i];
      if(sw){const t=l;l=r;r=t;}if(inv===1||inv===3)l=-l;if(inv===2||inv===3)r=-r;
      if(mono){l=r=(l+r)*.5;}
      if(dcf){this.dc[0]+=.0008*(l-this.dc[0]);this.dc[1]+=.0008*(r-this.dc[1]);l-=this.dc[0];r-=this.dc[1];}
      cg+=(g-cg)*sm;L[i]=l*cg*gl;R[i]=r*cg*gr;}
    this.g=cg;}}

/* ================= Sub / bass enhancer ================= */
const subfn=x=>Math.tanh(x*4)*.6-x*.3;
class FxSubx{constructor(E){this.E=E;this.os=new OS2();this.lp=new BiS();this.lp2=new BiS();this.hp=new BiS();this.dc=0;}
  proc(L,R,n,P){const sr=this.E.sr,f=P('freq'),amt=P('amount'),hm=P('harm'),lv=dbv(P('level'));this.os.prep(sr);
    this.lp.set('lp',f,.7071,0,sr);this.lp2.set('lp',f*2.2,.7071,0,sr);this.hp.set('hp',f*.5,.7071,0,sr);
    for(let i=0;i<n;i++){const m=(L[i]+R[i])*.5,low=this.lp.p(0,m);
      const h=this.lp2.p(0,this.hp.p(0,this.os.p(0,low,subfn)))*hm;
      const add=(low*amt*.5+h*amt)*lv;
      L[i]+=add;R[i]+=add;}}}

['level','Level',-12,12,0,{u:' dB',tip:'Level of the added weight.'}]
],FxSubx,1);

/* ================= Exciter ================= */
const EXK=1-Math.tanh(.25)**2,excfn=(x,dr,bias)=>Math.tanh(x*dr+bias)-Math.tanh(bias)-x*dr*EXK; // harmonics only: the linear part is added without delay
class FxExc{constructor(E){this.E=E;this.hp=new BiS();this.lp=new BiS();this.os=[new OS4(),new OS4()];}
  proc(L,R,n,P){const sr=this.E.sr,f=P('freq'),amt=P('amount'),dr=dbv(P('drive')),bias=.25;for(const o of this.os)o.prep(sr);
    this.hp.set('hp',f,.7071,0,sr);this.lp.set('lp',Math.min(sr*.45,f*6),.7071,0,sr);
    for(let i=0;i<n;i++)for(let c=0;c<2;c++){const X=c?R:L,h=this.hp.p(c,X[i]),s=h*dr*EXK+this.os[c].p(c,h,excfn,dr,bias);X[i]+=this.lp.p(c,s)*amt;}}}
fx('exciter','Exciter','Tools','Adds shine: saturates the highs and mixes the new harmonics in.',[
 ['freq','Above',1000,12000,4000,{k:'exp',u:' Hz',tip:'Only frequencies above this are excited.'}],['drive','Drive',0,24,10,{u:' dB',tip:'How hard the highs are saturated.'}],['amount','Amount',0,1.5,.5,{tip:'Level of the added harmonics.'}]
],FxExc,1);

/* ================= Stutter ================= */
class FxStutter{constructor(E){this.E=E;const m=Math.floor(E.sr*2);this.bl=new Float32Array(m);this.br=new Float32Array(m);this.m=m;this.w=0;this.fl=new Float32Array(m);this.fr=new Float32Array(m);this.on=false;this.pos=0;this.len=0;this.last=-1;}
  proc(L,R,n,P){const E=this.E,sr=E.sr,sl=SD(P('div')),pr=P('prob'),slen=SD(P('len')),adv=E.pv.bpm/60/sr;let bp=E.beat;
    const len=Math.max(32,Math.min(this.m-1,Math.floor(slen*60/E.pv.bpm*sr)));
    for(let i=0;i<n;i++){
      this.bl[this.w]=L[i];this.br[this.w]=R[i];this.w=(this.w+1)%this.m;
      const idx=Math.floor(bp/sl);
      if(idx!==this.last){this.last=idx;this.on=Math.random()<pr;
        if(this.on){this.len=len;for(let k=0;k<len;k++){const q=(this.w-len+k+this.m*2)%this.m;this.fl[k]=this.bl[q];this.fr[k]=this.br[q];}this.pos=0;}}
      if(this.on){const f=Math.min(1,this.pos/48,(this.len-this.pos)/48);const g=f<1?f:1;L[i]=this.fl[this.pos]*g+L[i]*(1-g);R[i]=this.fr[this.pos]*g+R[i]*(1-g);this.pos=(this.pos+1)%this.len;}
      bp+=adv;}}}

/* ================= Band splitter node ================= */
class SplitInst{
  constructor(E){this.E=E;this.xs=null;this.nb=0;this.bf=[];this.pk=[0,0,0,0];this.pm=undefined;}
  proc(L,R,n,P,node,depth){const E=this.E,nb=node.n||3;
    if(this.nb!==nb){this.nb=nb;this.xs=new XSplit(nb);this.bf=[];for(let j=0;j<nb;j++)this.bf.push({l:new Float32Array(64),r:new Float32Array(64)});}
    const f=[P('x1'),P('x2'),P('x3')].slice(0,nb-1);this.xs.set(f,E.sr);this.xs.split(L,R,n,this.bf);
    const so=node.so||[],ms=node.ms||[],solo=so.some(Boolean);
    for(let j=0;j<nb;j++){const b=this.bf[j];const ch=node.bands&&node.bands[j];if(ch&&ch.length)E.runChain(ch,b.l,b.r,n,depth+1);}
    for(let i=0;i<n;i++){L[i]=0;R[i]=0;}
    for(let j=0;j<nb;j++){const b=this.bf[j];let pk=0;
      const mute=ms[j]||(solo&&!so[j]),g=mute?0:dbv(P('g'+(j+1)));
      for(let i=0;i<n;i++){const l=b.l[i]*g,r=b.r[i]*g;L[i]+=l;R[i]+=r;const a=Math.abs(l)>Math.abs(r)?Math.abs(l):Math.abs(r);if(a>pk)pk=a;}
      this.pk[j]=Math.max(this.pk[j]*.9,pk);}
    E.bandMeter[node.id]=this.pk;}}

  const hold=c._pk||(c._pk=[{v:DBMIN,t:0},{v:DBMIN,t:0}]),now=performance.now(),bars=[l,r];
  for(let i=0;i<2;i++){const db=toDb(bars[i]),p=dbpos(db),pkk=hold[i];if(db>=pkk.v||now-pkk.t>1500){if(db>=pkk.v)pkk.t=now;pkk.v=db>=pkk.v?db:Math.max(db,pkk.v-.6);}
    const pp=dbpos(pkk.v);
    if(vertical){const bw=(W-14)/2-1,bx=14+i*(bw+2);g.fillStyle='rgba(255,255,255,.05)';g.fillRect(bx,0,bw,H);g.save();g.beginPath();g.rect(bx,H-p*H,bw,p*H);g.clip();g.fillStyle=meterGrad(g,0,H,0,0);g.fillRect(bx,0,bw,H);g.restore();
      if(pkk.v>DBMIN+1){g.fillStyle=peakCol(pkk.v);g.fillRect(bx,Math.min(H-2,H-pp*H),bw,2);}}
    else{const bh=(H-12)/2-1,by=i*(bh+2);g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,by,W,bh);g.save();g.beginPath();g.rect(0,by,p*W,bh);g.clip();g.fillStyle=meterGrad(g,0,0,W,0);g.fillRect(0,by,W,bh);g.restore();
      if(pkk.v>DBMIN+1){g.fillStyle=peakCol(pkk.v);g.fillRect(Math.min(W-2,pp*W),by,2,bh);}}}
  g.fillStyle=cssv('--dim');g.font='8px JetBrains Mono,monospace';g.textAlign='left';

var HIST={stack:[],pos:-1,t:null,label:'',busy:false,key:''};
function histState(){const st=presetState();st.frames={};for(const k in S.frames)st.frames[k]=S.frames[k].map(f=>Float32Array.from(f));return st;}
function histKey(st){let c=0;for(const k in st.frames)for(const f of st.frames[k])for(let i=0;i<f.length;i+=7)c+=f[i]*(i+1);return JSON.stringify([st.p,st.slots,st.chains,st.tabs,st.seq,st.draw,st.custom])+'|'+c.toFixed(4);}

  try{loadState(st,S.name,S.pid);S.frames={};for(const k in st.frames){S.frames[k]=st.frames[k].map(f=>Float64Array.from(f));}
    for(let o=0;o<6;o++){const k='abcdef'[o];if(S.frames[k])pushFrames(o);}
    S.hist=keepHist;tableBinds.forEach(f=>f());}finally{HIST.busy=false;}
  HIST.pos=i;HIST.key=histKey(histState());histUI();toast((i<HIST.stack.length?'Restored: ':'')+e.label);}
function undo(){if(HIST.t){histCommit(HIST.label);}if(HIST.pos>0)histApply(HIST.pos-1);else toast('Nothing to undo');}
function redo(){if(HIST.pos<HIST.stack.length-1)histApply(HIST.pos+1);else toast('Nothing to redo');}
function histUI(){const u=$('#undobtn'),r=$('#redobtn');if(u)u.classList.toggle('dim',HIST.pos<=0);if(r)r.classList.toggle('dim',HIST.pos>=HIST.stack.length-1);}

function applyFxChain(name,spec){S.chains=D.defaultChains();if(spec.clear){S.chains.x1=[];S.chains.x2=[];}

/* ---------- shared popup browser (search, chips, favorites, history) used by the preset and FX browsers ---------- */
function browserPopup(c){
  const st={q:'',f:{},fav:false,more:{}};const d=$('#dlg');d.innerHTML='';
  const list=h('div',{class:'pbl'}),right=h('div',{class:'pbrt'}),cnt=h('span',{class:'cap',style:'font-size:12px'});
  const q=h('input',{type:'text',class:'pbq',placeholder:c.placeholder||'name, type, genre or tag',spellcheck:'false'});
  let vis=[];
  const close=()=>{d.classList.remove('on');document.removeEventListener('keydown',esc,true);};
  const esc=e=>{if(e.key==='Escape'&&d.classList.contains('on')){close();e.stopPropagation();}};
  const match=it=>{
    if(st.q){const t=(it.name+' '+(it.sub||'')+' '+Object.values(it.cats||{}).join(' ')+' '+(it.tags||[]).join(' ')).toLowerCase();for(const w of st.q.toLowerCase().split(/\s+/).filter(Boolean))if(!t.includes(w))return false;}
    for(const k in st.f)if(st.f[k]!=null&&![].concat((it.cats||{})[k]||[]).includes(st.f[k]))return false;
    if(st.fav&&!it.fav)return false;return true;};
  const row=it=>{const r=h('div',{class:'pbr'+(it.sel&&it.sel()?' on':''),onclick:()=>{c.pick(it);redraw();}},[]);if(it.tip)r.setAttribute('data-tip',it.tip);
    if(c.setFav)r.appendChild(h('span',{class:'hrt'+(it.fav?' on':''),text:it.fav?'♥':'♡','data-tip':'Favorite',onclick:e=>{e.stopPropagation();c.setFav(it,!it.fav);redraw();}}));
    r.appendChild(h('span',{class:'pbn'},[h('b',{text:it.name}),it.sub?h('i',{text:it.sub}):null].filter(Boolean)));
    if(it.tag)r.appendChild(h('span',{class:'pbt',text:it.tag}));
    if(it.del)r.appendChild(h('span',{class:'pbx',text:'x','data-tip':'Delete this saved preset.',onclick:e=>{e.stopPropagation();it.del();redraw();}}));
    return r;};
  const drawList=()=>{const sc=list.scrollTop;list.innerHTML='';const all=c.items();vis=all.filter(match);cnt.textContent=vis.length+' '+(c.noun||'sounds');
    let g=null;for(const it of vis){if(it.group!==g){g=it.group;list.appendChild(h('div',{class:'pbg',text:g}));}list.appendChild(row(it));}
    if(!vis.length)list.appendChild(h('div',{class:'cap',style:'padding:24px;text-align:center;white-space:normal',text:'Nothing matches. Clear the search or a filter.'}));
    list.scrollTop=sc;return all;};
  const chip=(label,on,fn)=>h('span',{class:'pbchip'+(on?' on':''),text:label,onclick:fn});
  const drawRight=all=>{right.innerHTML='';
    right.append(h('div',{},[h('div',{class:'pbcap',text:'SEARCH'}),q]));
    for(const r of (c.rows||[])){const m={};for(const it of all)for(const v of [].concat((it.cats||{})[r.key]||[]))m[v]=(m[v]||0)+1;
      let vals=Object.keys(m).sort((a,b)=>r.order?(r.order.indexOf(a)<0?99:r.order.indexOf(a))-(r.order.indexOf(b)<0?99:r.order.indexOf(b)):m[b]-m[a]||a.localeCompare(b));
      if(!r.fav&&(!vals.length||(vals.length<2&&!r.always)))continue;const lim=r.max||99,ex=st.more[r.key];const shown=ex?vals:vals.slice(0,lim);
      const chips=shown.map(v=>chip(v,st.f[r.key]===v,()=>{st.f[r.key]=st.f[r.key]===v?null:v;redraw();}));
      if(r.fav&&c.setFav)chips.unshift(chip('♥ Favorites',st.fav,()=>{st.fav=!st.fav;redraw();}));
      if(vals.length>lim)chips.push(chip(ex?'Less':'+'+(vals.length-lim)+' more',false,()=>{st.more[r.key]=!ex;redraw();}));
      right.append(h('div',{},[h('div',{class:'pbcap',text:r.label}),h('div',{class:'pbchips'},chips)]));}
    if(!(c.rows||[]).length&&c.setFav)right.append(h('div',{class:'pbchips'},[chip('♥ Favorites',st.fav,()=>{st.fav=!st.fav;redraw();})]));
    const hs=c.history?c.history():[];if(hs.length)right.append(h('div',{},[h('div',{class:'pbcap',text:'HISTORY (CLICK TO GO BACK)'}),h('div',{class:'pbchips'},hs.map(n=>chip(n,false,()=>{c.histPick(n);redraw();})))]));
    if(c.hint)right.append(h('div',{class:'pbhint',text:c.hint}));
    if(c.extra)right.append(c.extra);};
  const redraw=()=>{const all=drawList();drawRight(all);q.value=st.q;if(document.activeElement!==q&&c.keepFocus!==false)q.focus();};
  q.oninput=()=>{st.q=q.value;const pos=q.selectionStart;const all=drawList();cnt.textContent=cnt.textContent;};
  q.onkeydown=e=>{e.stopPropagation();
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!vis.length)return;let i=vis.findIndex(x=>x.sel&&x.sel());i=e.key==='ArrowDown'?Math.min(vis.length-1,i+1):Math.max(0,i<0?0:i-1);c.pick(vis[i]);drawList();const on=list.querySelector('.pbr.on');if(on)on.scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter')close();};
  const foot=h('div',{class:'pbf'},[cnt,h('span',{class:'sp'}),...(c.footer||[]),h('button',{class:'btn on',text:'Close',onclick:close})]);
  const box=h('div',{class:'pbox'},[h('div',{class:'pbh'},[h('h2',{text:c.title})]),h('div',{class:'pbbody'},[list,right]),foot]);
  d.appendChild(box);d.classList.add('on');d.onclick=e=>{if(e.target===d)close();};document.addEventListener('keydown',esc,true);
  c.redraw=redraw;redraw();setTimeout(()=>{q.focus();const on=list.querySelector('.pbr.on');if(on)on.scrollIntoView({block:'center'});},30);return c;}

    hint:'Click a sound to load it, use the arrow keys to step through the list, Enter to close. ♥ marks your favorites. Save, rate, tag and delete live on the Presets tab.',
    items:()=>{const all=allPresets();const out=[];const mk=(p,group)=>({id:p.id,name:p.name,tag:p.type,group,fav:p.fav,sel:()=>p.id===S.pid||(!S.pid&&p.name===S.name),tip:p.note||'',cats:{Type:[p.type],Genre:[p.genre],Show:[p.kind==='u'?'My presets':'Factory']},tags:p.tags,p});

function metaAll(){try{return JSON.parse(store.get(META_K)||'{}');}catch(e){return {};}}

function userPresets(){try{return JSON.parse(store.get('ww_user')||'[]');}catch(e){return [];}}

function autoTags(f){const t=new Set(),p=f.p||{},ch=f.chains||{},all=Object.values(ch).flat().map(n=>n[0]);
  const has=x=>all.includes(x);
  if(p.vmode===1)t.add('Mono');if((p['a.uv']||1)>=5||has('image'))t.add('Wide');
  if((f.slots||[]).some(s=>/^l\d$/.test(s.s)&&/pos|w1a|w2a/.test(s.d)))t.add('Evolving');
  const c=p['f1.cut'];if(c!==undefined){if(c>4000)t.add('Bright');if(c<1500)t.add('Dark');}
  if(has('dist')||has('crush')||/Rawstyle|Dubstep|Hardstyle|Industrial/.test(f.genre))t.add('Aggressive');
  if((p['e1.a']||0)>200)t.add('Soft');if(f.type==='Pluck')t.add('Plucky');if(p['s.sub'])t.add('Sub');
  if(has('tgate')||f.type==='Arp')t.add('Rhythmic');if(has('verb'))t.add('Spacey');if(has('delay'))t.add('Echo');
  if(has('vowel')||/Vocal/.test(f.genre))t.add('Vocal');if(/Lo-Fi|Vintage/.test(f.genre+f.name))t.add('Lo-Fi');
  if(/Ambient|Cinematic/.test(f.genre))t.add('Cinematic');
  return [...t];}
function allPresets(){const M=metaAll();
  const fac=FACT.map((f,i)=>{const m=Object.assign({},FACT_DEFAULT[f.name]||{},M[f.id]||{});return {kind:'f',i,id:f.id,name:f.name,type:m.type||f.type,genre:m.genre||f.genre,tags:m.tags||autoTags(f),rating:m.rating||0,fav:!!m.fav,note:m.note||'',start:f.start,created:0};});
  const usr=userPresets().map((u,i)=>({kind:'u',i,id:'u'+i,name:u.name,type:u.type||'Lead',genre:u.genre||'My preset',tags:u.tags||[],rating:u.rating||0,fav:!!u.fav,note:u.note||'',start:false,created:u.created||0}));
  return fac.concat(usr);}
function setMeta(p,patch){if(!p)return;if(p.kind==='f'){const M=metaAll();M[p.id]=Object.assign(M[p.id]||{},patch);metaSave(M);}
  else{const l=userPresets();if(!l[p.i])return;Object.assign(l[p.i],patch);saveUser(l);}}
const PF={lib:'all',type:null,genre:null,tags:[],minr:0,q:'',sort:'name'};
function visiblePresets(){const q=PF.q.toLowerCase();let l=allPresets().filter(p=>{
    if(PF.lib==='fav'&&!p.fav)return false;if(PF.lib==='start'&&!p.start)return false;if(PF.lib==='user'&&p.kind!=='u')return false;if(PF.lib==='recent'&&!S.hist.includes(p.name))return false;
    if(PF.type&&p.type!==PF.type)return false;if(PF.genre&&p.genre!==PF.genre)return false;if(p.rating<PF.minr)return false;
    for(const t of PF.tags)if(!p.tags.includes(t))return false;
    return !q||(p.name+' '+p.type+' '+p.genre+' '+p.tags.join(' ')+' '+p.note).toLowerCase().includes(q);});
  const by={name:(a,b)=>a.name.localeCompare(b.name),rating:(a,b)=>b.rating-a.rating||a.name.localeCompare(b.name),cat:(a,b)=>a.type.localeCompare(b.type)||a.name.localeCompare(b.name),genre:(a,b)=>a.genre.localeCompare(b.genre)||a.name.localeCompare(b.name),recent:(a,b)=>S.hist.indexOf(a.name)-S.hist.indexOf(b.name),newest:(a,b)=>b.created-a.created};
  if(PF.sort==='recent')l=l.filter(p=>S.hist.includes(p.name));
  return l.sort(by[PF.sort]||by.name);}

const RG={osc:()=>['a','b','c','d','e','f'].filter(k=>S.p[k+'.on']).flatMap(k=>['pos','w1a','w2a','sw','sk','ud','ub','usp','ph','fb','ma'].map(x=>k+'.'+x)),
  filter:()=>['f1.cut','f1.res','f1.env','f1.drv','f1.kt'],env:()=>['e1.a','e1.d','e1.s','e1.r','e2.a','e2.d','e2.s','e2.r']};
const GEN={amt:.5,groups:{osc:true,filter:true,env:true,fx:false,mod:false},undo:null};
const GOODF=[2,3,14,15,16,21,22,8,9,23,29,30,43,44,45];
function snap(){GEN.undo={st:presetState(),name:S.name,pid:S.pid};}
function applyAfter(){reindex();markChains();syncAll();refreshAll();tableBinds.forEach(f=>f());renderFx();rebuildMatrix&&rebuildMatrix();updateFavBtn();}
function rndAround(k,amt){const sp=PR[k];if(!sp)return;let n=toN(sp,S.p[k]);n=clamp(n+(Math.random()*2-1)*amt,0,1);let v=fromN(sp,n);if(sp.k==='int'||sp.k==='list')v=Math.round(v);
  if(k==='e1.a'&&v>800&&S.p[k]<=800)v=800;if(k==='e1.r'&&v>3000&&S.p[k]<=3000)v=3000;if(k==='f1.cut'&&v<120)v=120;if(k==='f1.res'&&v>.85)v=.85;if(k==='e1.s'&&v<.05)v=.05;S.p[k]=v;}
function randomizeSound(mode){snap();const amt=mode==='mutate'?Math.min(GEN.amt,.35)*.6:GEN.amt;
  for(const g of ['osc','filter','env'])if(GEN.groups[g])for(const k of RG[g]())rndAround(k,amt);
  if(GEN.groups.filter&&amt>.45)S.p['f1.type']=GOODF[Math.floor(Math.random()*GOODF.length)];
  if(GEN.groups.osc&&amt>.55&&mode!=='mutate'){for(const o of [0,1]){if(S.p['abcdef'[o]+'.on']){loadTable(o,RECIPE_LIST[Math.floor(Math.random()*RECIPE_LIST.length)].name);}}}
  if(GEN.groups.fx&&mode!=='mutate'){const pool=['chorus','delay','verb','phaser','dist','crush','trem','flanger'];S.chains.t0=S.chains.t0.slice(0,1);const n=1+Math.floor(Math.random()*2);for(let i=0;i<n;i++)S.chains.t0.push(D.newNode(pool[Math.floor(Math.random()*pool.length)]));}
  if(GEN.groups.mod&&mode!=='mutate'){S.slots=S.slots.slice(0,6);const srcs=['l1','l2','l3','e3','wheel','vel'],dst=['a.pos','a.w1a','f1.cut','a.sw','a.ud','b.pos','a.w2a'];const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){const s=srcs[Math.floor(Math.random()*srcs.length)],d=dst[Math.floor(Math.random()*dst.length)];if(PR[d]&&!S.slots.some(x=>x.s===s&&x.d===d))S.slots.push({s,d,a:(Math.random()<.5?-1:1)*(.2+Math.random()*.5),u:0});}}
  S.pid=null;S.name=(mode==='mutate'?'Mutation':'Random')+' '+Math.floor(Math.random()*900+100);$('#pname').textContent=S.name;applyAfter();refreshPresetUI();toast(mode==='mutate'?'Mutated. Undo is in the Generate box':'Randomized');}

const WORDCAT={lead:'Lead',leads:'Lead',pluck:'Pluck',plucks:'Pluck',stab:'Pluck',bass:'Bass',sub:'Bass',keys:'Keys',piano:'Keys',organ:'Keys',pad:'Pad',pads:'Pad',strings:'Pad',arp:'Arp',arpeggio:'Arp',fx:'FX',riser:'FX',impact:'FX',sweep:'FX'};
function generateFromText(txt){const w=txt.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);if(!w.length){toast('Describe the sound first, for example: dark wobble bass');return;}
  snap();let cat=null;for(const x of w)if(WORDCAT[x]){cat=WORDCAT[x];break;}
  const all=allPresets();const gw=all.filter(p=>w.some(x=>p.genre.toLowerCase().includes(x)||p.name.toLowerCase().includes(x)||p.tags.some(t=>t.toLowerCase()===x)));
  let pool=all.filter(p=>p.kind==='f'&&(!cat||p.type===cat));const pg=pool.filter(p=>gw.includes(p));if(pg.length)pool=pg;
  const base=pool[Math.floor(Math.random()*pool.length)]||all[0];loadFactory(base.i);
  const mul=(k,f,lo,hi)=>{S.p[k]=clamp(S.p[k]*f,lo,hi);};const has=x=>w.includes(x);
  if(has('dark')||has('deep')||has('dull'))mul('f1.cut',.4,60,20000);
  if(has('bright')||has('airy')||has('shiny'))mul('f1.cut',2.4,60,18000);
  if(has('warm')){S.p['f1.type']=FT_('Warm Diode');mul('f1.cut',.8,60,20000);}
  if(has('soft')||has('smooth')||has('slow')||has('gentle')){S.p['e1.a']=Math.max(S.p['e1.a'],140);S.p['e1.r']=Math.max(S.p['e1.r'],700);}
  if(has('hard')||has('aggressive')||has('angry')||has('harsh')||has('growl')||has('dirty')){S.chains.t0.push(D.newNode('dist',{drive:12}));S.p['f1.res']=Math.min(.8,S.p['f1.res']+.15);}

function demoClear(){demoHeld.forEach(h=>release(h.n));demoHeld=[];}
function demoTick(){const P=DEMOS[demoSel],ms=60000/P.bpm/4;demoHeld=demoHeld.filter(h=>{if(h.end<=demoI){release(h.n);return false;}return true;});
  const st=demoI%P.len;for(const e of P.ev)if(e[0]===st)for(const n of e[1]){press(n,e[3]||.8);demoHeld.push({n,end:demoI+e[2]});}
  demoI++;demoT=setTimeout(demoTick,ms);}
function toggleDemo(){demoOn=!demoOn;$('#demobtn').classList.toggle('on',demoOn);$('#demobtn').textContent=demoOn?'Stop demo':'Play demo';if(demoOn){startAudio().then(()=>{demoI=0;demoTick();});}else{clearTimeout(demoT);demoClear();}}
function setDemo(i){demoSel=i;const pr=DEMOS[i].pre;if(pr){const q=allPresets().find(x=>x.name===pr);if(q)loadPreset(q);}if(demoOn){clearTimeout(demoT);demoClear();demoI=0;demoTick();}}
/* ---------- animation loop and boot ---------- */
let lastVis=0,lastCh=0;
function frame(ts){requestAnimationFrame(frame);if(document.hidden)return;
  if(chainsDirty&&ts-lastCh>60){chainsDirty=false;lastCh=ts;sendChains();}
  if(vlocal&&ts-lastVis>33){lastVis=ts;S.V=vlocal.vis();}
  for(const a of animators)try{a.draw();}catch(e){if(!a.err){a.err=1;console.error('draw error',e);}}
  if(meterEls.master&&false){}
  if(S.page==='mixer'&&S.V){/* meters drawn by animator */}
  for(const b in meterEls){/* header meter handled in app animator */}
}
function boot(){const tt=store.get('ww_theme');if(tt)S.theme=tt;S.tips=store.get('ww_tips')!=='0';document.body.className='look-'+S.theme;
  $$('.cheek').forEach(c=>{c.dataset.tip='Drag the window edges to resize. Double click here to reset to 100%.';c.addEventListener('dblclick',()=>{VIEW.zoom=1;fit();});});
  makeHandles();buildApp();fit();showPage('sound');loadFactory(0);$('#pname').textContent='Init';
  document.addEventListener('visibilitychange',()=>{});requestAnimationFrame(frame);
  const first=()=>{startAudio();document.removeEventListener('pointerdown',first,true);};
  document.addEventListener('pointerdown',first,true);}

addEventListener('change',e=>{if(e.target&&e.target.tagName==='SELECT')e.target.blur();}); // no leftover focus ring after picking from a menu

window.addEventListener('DOMContentLoaded',boot);
